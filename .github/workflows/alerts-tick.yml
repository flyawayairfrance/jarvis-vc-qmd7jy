name: DAVOS alerts tick
# Free external pinger (Vercel Hobby crons are daily only). Every 15 min, Mon-Fri, 00:00-19:59 UTC = 07:00-02:59 Bangkok.
# /api/tick is self-throttled and cheap (exits early when nobody has push enabled or a session/alert due).
on:
  schedule:
    - cron: '*/15 0-19 * * 1-5'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 "https://trading-assistant-api-r2rdjjf2yc-4746.vercel.app/api/tick" || true
